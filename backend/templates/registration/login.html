{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center"><i class="bi bi-shield-lock"></i> Log in to ThreatLens</h1>
        {% if form.non_field_errors %}
        <div class="alert alert-danger" role="alert">Invalid username or password.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" id="id_username" class="form-control"
                   value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password" class="form-control"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
      </div>
    </div>
    <p class="text-center text-body-secondary small mt-3">Accounts are created by the administrator.</p>
  </div>
</div>
{% endblock %}
